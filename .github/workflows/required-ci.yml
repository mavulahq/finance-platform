name: Required CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: required
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: getfluxo
          POSTGRES_PASSWORD: getfluxo_dev
          POSTGRES_DB: getfluxo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U getfluxo -d getfluxo" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://getfluxo:getfluxo_dev@127.0.0.1:5432/getfluxo?schema=public
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Audit main update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")

          valid_main_update=false
          if jq -e --arg sha "$GITHUB_SHA" \
            'any(.[]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)' \
            <<<"$response" >/dev/null; then
            valid_main_update=true
          else
            commit_response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA")
            pr_number=$(jq -r \
              'try (.commit.message | capture("\\(#(?<number>[0-9]+)\\)").number) catch empty' \
              <<<"$commit_response")

            if [ -n "$pr_number" ]; then
              pull_response=$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$pr_number")
              if jq -e --arg sha "$GITHUB_SHA" \
                '.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha' \
                <<<"$pull_response" >/dev/null; then
                valid_main_update=true
              fi
            fi
          fi

          if [ "$valid_main_update" != "true" ]; then
            echo "::error::main was updated without an associated merged pull request. This update is recorded as a policy violation."
            exit 1
          fi

      - name: Verify submodule credentials
        env:
          SUBMODULES_SSH_KEY: ${{ secrets.SUBMODULES_SSH_KEY }}
        run: |
          if [ -z "$SUBMODULES_SSH_KEY" ]; then
            echo "SUBMODULES_SSH_KEY is required to clone private submodules." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout private submodules
        env:
          SUBMODULES_SSH_KEY: ${{ secrets.SUBMODULES_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          key_file=$(mktemp "$HOME/.ssh/getfluxo-ci-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SUBMODULES_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate architecture contracts
        run: |
          if [ -f scripts/validate-domain-contracts.mjs ]; then
            pnpm contracts:check
          else
            echo "Architecture contract validator is not present on this revision."
          fi

      - name: Build implemented services
        run: |
          pnpm --filter @getfluxo/fpay build
          pnpm --filter @getfluxo/fengine build
          pnpm --filter @getfluxo/fwk build

      - name: Test fpay
        run: pnpm --filter @getfluxo/fpay test

      - name: Sync database schema
        run: pnpm --filter @getfluxo/fengine exec prisma db push --skip-generate

      - name: Test fengine
        run: pnpm --filter @getfluxo/fengine test:all

      - name: Test fwk
        run: pnpm --filter @getfluxo/fwk test:all
