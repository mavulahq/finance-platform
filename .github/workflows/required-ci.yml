name: Required CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: required
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mavula
          POSTGRES_PASSWORD: mavula_dev
          POSTGRES_DB: mavula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mavula -d mavula" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://mavula:mavula_dev@127.0.0.1:5432/mavula?schema=public
      LEDGER_CORE_MIGRATION_DATABASE_URL: postgresql://mavula:mavula_dev@127.0.0.1:5432/mavula?schema=public
      LEDGER_CORE_DATABASE_ROLE_PASSWORD: mavula_ledger_ci_password
      LEGACY_CONNECTORS_MIGRATION_DATABASE_URL: postgresql://mavula:mavula_dev@127.0.0.1:5432/mavula?schema=legacy_connectors
      LEGACY_CONNECTORS_DATABASE_ROLE_PASSWORD: mavula_legacy_ci_password
      LEGACY_CONNECTORS_DATABASE_URL: postgresql://legacy_connectors_app:mavula_legacy_ci_password@127.0.0.1:5432/mavula?schema=legacy_connectors
      REDIS_URL: redis://:compose-validation-placeholder@127.0.0.1:6379
      REDIS_PASSWORD: compose-validation-placeholder
      JOB_SIGNING_SECRET: compose-validation-placeholder
      IDENTITY_DATABASE_URL: postgresql://mavula:mavula_dev@postgres:5432/mavula?schema=identity
      LEDGER_CORE_DATABASE_URL: postgresql://mavula:mavula_dev@postgres:5432/mavula?schema=public
      WORKBENCH_DATABASE_URL: postgresql://mavula:mavula_dev@postgres:5432/mavula?schema=settlements
      IDENTITY_ISSUER: https://identity.example.test
      IDENTITY_JWKS_JSON: '{"keys":[]}'
      IDENTITY_COOKIE_KEYS: guardian-cookie-key-one-32-characters,guardian-cookie-key-two-32-characters
      OIDC_AUTHORIZATION_ENDPOINT: https://identity.example.test/auth
      OIDC_JWKS_URI: https://identity.example.test/jwks
      OIDC_TOKEN_ENDPOINT: https://identity.example.test/token
      WORKBENCH_OIDC_CLIENT_ID: workbench-ci
      WORKBENCH_PRIVATE_JWK_JSON: '{}'
    steps:
      - name: Audit main update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")

          valid_main_update=false
          if jq -e --arg sha "$GITHUB_SHA" \
            'any(.[]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)' \
            <<<"$response" >/dev/null; then
            valid_main_update=true
          else
            commit_response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA")
            pr_number=$(jq -r \
              'try (.commit.message | split("\n")[0] | sub("\\s+$"; "") | capture(".*\\(#(?<number>[0-9]+)\\)$").number) catch empty' \
              <<<"$commit_response")

            if [ -n "$pr_number" ]; then
              pull_response=$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$pr_number")
              if jq -e --arg sha "$GITHUB_SHA" \
                '.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha' \
                <<<"$pull_response" >/dev/null; then
                valid_main_update=true
              fi
            fi
          fi

          if [ "$valid_main_update" != "true" ]; then
            echo "::error::main was updated without an associated merged pull request. This update is recorded as a policy violation."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout public submodules
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Use Node.js 22.22.3
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run master guardian
        run: pnpm guardian:check

      - name: Validate architecture contracts
        run: pnpm contracts:check

      - name: Build implemented services
        run: |
          pnpm --filter @mavula/identity-access build
          pnpm --filter @mavula/settlements build
          pnpm --filter @mavula/ledger-core build
          pnpm --filter @mavula/legacy-connectors build
          pnpm --filter @mavula/workbench build

      - name: Validate public OpenAPI contracts
        run: |
          pnpm --filter @mavula/identity-access openapi:check
          pnpm --filter @mavula/ledger-core openapi:check
          pnpm --filter @mavula/workbench openapi:check
          pnpm --filter @mavula/developer-docs contracts:check
          pnpm --filter @mavula/developer-docs test
          pnpm --filter @mavula/developer-docs build

      - name: Test legacy batch runtime
        run: pnpm --filter @mavula/legacy-connectors test

      - name: Sync and test legacy batch PostgreSQL runtime
        run: |
          DATABASE_URL="$LEGACY_CONNECTORS_MIGRATION_DATABASE_URL" pnpm --filter @mavula/legacy-connectors prisma:migrate
          pnpm --filter @mavula/legacy-connectors database:provision-role
          pnpm --filter @mavula/legacy-connectors test:postgres

      - name: Sync identity-access database schema
        run: DATABASE_URL="postgresql://mavula:mavula_dev@127.0.0.1:5432/mavula?schema=identity" pnpm --filter @mavula/identity-access prisma:migrate

      - name: Test identity-access
        run: pnpm --filter @mavula/identity-access test

      - name: Test settlements
        run: pnpm --filter @mavula/settlements test

      - name: Sync ledger-core database schema
        run: |
          pnpm --filter @mavula/ledger-core database:migrate
          pnpm --filter @mavula/ledger-core database:provision-role

      - name: Test ledger-core
        run: pnpm --filter @mavula/ledger-core test:all

      - name: Test ledger-core tenant RLS
        env:
          DATABASE_URL: postgresql://ledger_core_app:mavula_ledger_ci_password@127.0.0.1:5432/mavula?schema=public&connection_limit=1
        run: pnpm --filter @mavula/ledger-core test:rls

      - name: Test workbench
        run: pnpm --filter @mavula/workbench test:all

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate Minikube manifests
        run: kubectl kustomize packages/operations/kubernetes/overlays/minikube
