packages:
  - packages/fengine
  - packages/fwallet
  - packages/fwallet-mobile
  - packages/fagent
  - packages/fwk
  - packages/fxAI
  - packages/fpay
  - packages/finfra
  - packages/fdocs

shared-dependencies:
  peerDependencyRules:
    ignoreMissing:
      - react
      - react-dom
      - react-native/core-utils

catalog:
  # Core dependencies
  nest: '10.3.0'
  nestjs/common: '10.3.0'
  nestjs/core: '10.3.0'
  nestjs/jwt: '10.2.0'
  nestjs/passport: '10.0.3'
  nestjs/graphql: '12.1.0'
  nestjs/typeorm: '9.0.1'

  prisma: '5.7.0'
  '@prisma/client': '5.7.0'

  bull: '4.12.0'
  bullmq: '5.0.0'
  ioredis: '5.3.2'
  redis: '4.6.11'

  express: '4.18.2'
  fastify: '4.25.2'
  fastify/cors: '4.25.2'
  fastify/helmet: '11.1.1'
  fastify/rate-limit: '9.1.0'

  zod: '3.22.4'
  joi: '17.11.0'

  bcryptjs: '2.4.3'
  jsonwebtoken: '9.1.2'
  passport: '0.7.0'
  passport-jwt: '4.0.1'

  pino: '8.17.2'
  pino-pretty: '10.3.1'
  winston: '3.11.0'

  axios: '1.6.5'
  openai: '4.28.2'
  groq-sdk: '0.4.1'

  vue: '3.3.10'
  nuxt: '3.8.2'
  pinia: '2.1.6'
  tanstack/vue-query: '5.28.0'

  tailwindcss: '3.4.1'
  postcss: '8.4.32'
  autoprefixer: '10.4.16'

  typescript: '5.3.3'
  tsx: '4.7.0'
  vitest: '1.0.4'
  jest: '29.7.0'
  '@testing-library/vue': '8.0.1'

catalogs:
  devDependencies:
    '@types/node': '^24.0.0'
    '@types/jest': '^29.5.11'
    '@typescript-eslint/parser': '^6.13.0'
    '@typescript-eslint/eslint-plugin': '^6.13.0'
    eslint: '^8.54.0'
    prettier: '^3.1.0'
    husky: '^8.0.3'
    lint-staged: '^15.2.0'
