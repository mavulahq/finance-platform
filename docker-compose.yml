name: mavula-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: mavula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mavula
      POSTGRES_PASSWORD: mavula_dev
      POSTGRES_DB: mavula
    ports:
      - "15432:5432"
    volumes:
      - mavula-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mavula -d mavula"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mavula-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mavula_dev}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-mavula_dev}"]
    ports:
      - "16379:6379"
    volumes:
      - mavula-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mavula_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-access:
    build:
      context: .
      dockerfile: packages/identity-access/Dockerfile
      target: builder
    container_name: mavula-identity-access
    restart: unless-stopped
    working_dir: /usr/src/app
    environment:
      NODE_ENV: development
      PORT: 3020
      DATABASE_URL: ${IDENTITY_DATABASE_URL:?configure IDENTITY_DATABASE_URL in .env}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:?configure IDENTITY_ISSUER in .env}
      IDENTITY_JWKS_JSON: ${IDENTITY_JWKS_JSON:?configure IDENTITY_JWKS_JSON in .env}
      IDENTITY_COOKIE_KEYS: ${IDENTITY_COOKIE_KEYS:?configure IDENTITY_COOKIE_KEYS in .env}
      IDENTITY_RESOURCE_AUDIENCES: ${IDENTITY_RESOURCE_AUDIENCES:-urn:mavula:identity-access,urn:mavula:ledger-core,urn:mavula:workbench}
    command: [pnpm, --filter, "@mavula/identity-access", start:dev]
    ports:
      - "13020:3020"
    volumes:
      - ./packages/identity-access/src:/usr/src/app/packages/identity-access/src:Z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:3020/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ledger-core:
    build:
      context: .
      dockerfile: packages/ledger-core/Dockerfile
      target: dev
    container_name: mavula-ledger-core
    restart: unless-stopped
    working_dir: /usr/src/app
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${LEDGER_CORE_DATABASE_URL:?configure LEDGER_CORE_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://:mavula_dev@redis:6379}
      JOB_SIGNING_KEY: ${JOB_SIGNING_KEY:?configure JOB_SIGNING_KEY in .env}
      OIDC_ISSUER: ${IDENTITY_ISSUER:?configure IDENTITY_ISSUER in .env}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:?configure OIDC_AUTHORIZATION_ENDPOINT in .env}
      OIDC_AUDIENCE: urn:mavula:ledger-core
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?configure OIDC_JWKS_URI in .env}
    command:
      - sh
      - -lc
      - pnpm --filter @mavula/ledger-core start:dev
    ports:
      - "13000:3000"
    volumes:
      - ./packages/ledger-core/src:/usr/src/app/packages/ledger-core/src:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-access:
        condition: service_healthy

  workbench:
    build:
      context: .
      dockerfile: packages/workbench/Dockerfile
      target: dev
    container_name: mavula-workbench
    restart: unless-stopped
    working_dir: /usr/src/app
    environment:
      NODE_ENV: development
      PORT: 3010
      DATABASE_URL: ${WORKBENCH_DATABASE_URL:?configure WORKBENCH_DATABASE_URL in .env}
      LEGACY_CONNECTORS_DATABASE_URL: ${LEGACY_CONNECTORS_DATABASE_URL:?configure LEGACY_CONNECTORS_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://:mavula_dev@redis:6379}
      JOB_SIGNING_KEY: ${JOB_SIGNING_KEY:?configure JOB_SIGNING_KEY in .env}
      WORKBENCH_WORKER_ENABLED: "true"
      WORKBENCH_QUEUES: payments,platform,legacy
      WORKBENCH_LEGACY_BATCH_STORE: postgres
      LEDGER_CORE_URL: http://ledger-core:3000
      OIDC_ISSUER: ${IDENTITY_ISSUER:?configure IDENTITY_ISSUER in .env}
      OIDC_AUDIENCE: urn:mavula:workbench
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?configure OIDC_JWKS_URI in .env}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:?configure OIDC_TOKEN_ENDPOINT in .env}
      WORKBENCH_OIDC_CLIENT_ID: ${WORKBENCH_OIDC_CLIENT_ID:?configure WORKBENCH_OIDC_CLIENT_ID in .env}
      WORKBENCH_PRIVATE_JWK_JSON: ${WORKBENCH_PRIVATE_JWK_JSON:?configure WORKBENCH_PRIVATE_JWK_JSON in .env}
      LEDGER_CORE_AUDIENCE: urn:mavula:ledger-core
    command:
      - sh
      - -lc
      - pnpm --filter @mavula/workbench start:dev
    ports:
      - "13010:3010"
    volumes:
      - ./packages/workbench/src:/usr/src/app/packages/workbench/src:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-access:
        condition: service_healthy
      ledger-core:
        condition: service_started

volumes:
  mavula-postgres-data:
  mavula-redis-data:
