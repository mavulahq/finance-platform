name: getfluxo-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: getfluxo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: getfluxo
      POSTGRES_PASSWORD: getfluxo_dev
      POSTGRES_DB: getfluxo
    ports:
      - "15432:5432"
    volumes:
      - getfluxo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getfluxo -d getfluxo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: getfluxo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - getfluxo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fengine:
    build:
      context: .
      dockerfile: packages/fengine/Dockerfile
    container_name: getfluxo-fengine
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://getfluxo:getfluxo_dev@postgres:5432/getfluxo?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-development-secret
      INTERNAL_API_KEY: docker-internal-api-key
    ports:
      - "13000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fwk:
    build:
      context: .
      dockerfile: packages/fwk/Dockerfile
    container_name: getfluxo-fwk
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3010
      DATABASE_URL: postgresql://getfluxo:getfluxo_dev@postgres:5432/getfluxo?schema=public
      REDIS_URL: redis://redis:6379
      FWK_WORKER_ENABLED: "true"
      FWK_QUEUES: payments,platform
      FENGINE_URL: http://fengine:3000
      INTERNAL_API_KEY: docker-internal-api-key
    ports:
      - "13010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fengine:
        condition: service_started

volumes:
  getfluxo-postgres-data:
  getfluxo-redis-data:
