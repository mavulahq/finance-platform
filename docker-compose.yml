name: mavula-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: mavula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mavula
      POSTGRES_PASSWORD: mavula_dev
      POSTGRES_DB: mavula
    ports:
      - "15432:5432"
    volumes:
      - mavula-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mavula -d mavula"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mavula-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - mavula-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mavula-postgres-data:
  mavula-redis-data:
